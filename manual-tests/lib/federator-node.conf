# Shared base configuration for every federator node started by a manual scenario.
#
# There is one of these for all the nodes, not one per node: everything that differs between
# them - the peer private key, the ports, the signer key paths and the peer list - is passed as a
# -D system property by lib/federate-runner.js, and rskj's ConfigLoader layers system properties
# above the file given in -Drsk.conf.file. So this file only holds what every node shares.
#
# The genesis federation is deliberately not configured here. rskj's regtest default
# (BridgeRegTestConstants.DEFAULT_FEDERATION_PUBLIC_KEYS) is exactly the first three keys of the
# federator pool, so leaving it alone gives the scenarios the federation they want.

federator {
    enabled = true
    bitcoinPeerAddresses = [
        "127.0.0.1:18444"
    ]
    gasPrice = 1000
}

rpc {
    modules = [
        {
            name: "eth",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "net",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "rpc",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "web3",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "evm",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "mnr",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "personal",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "fed",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "rsk",
            version: "1.0",
            enabled: "true",
        }
    ]
}
