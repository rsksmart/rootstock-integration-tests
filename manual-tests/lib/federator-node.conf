# Shared base configuration for every federator node started by a manual scenario.
#
# There is one of these for all the nodes, not one per node: everything that differs between
# them - the peer private key, the ports, the signer key paths and the peer list - is passed as a
# -D system property by lib/federate-runner.js, and rskj's ConfigLoader layers system properties
# above the file given in -Drsk.conf.file. So this file only holds what every node shares.
#
# Note there is no genesis federation setting here, on purpose. rskj lets a regtest node override
# it with `genesis_constants.federationPublicKeys`, but the scenarios do not need to: the pool in
# lib/federator-keys.js starts with the same three keys rskj already uses by default. Leaving the
# setting out keeps one less thing in sync.

federator {
    enabled = true
    bitcoinPeerAddresses = [
        "127.0.0.1:18444"
    ]
    gasPrice = 1000
}

rpc {
    modules = [
        {
            name: "eth",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "net",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "rpc",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "web3",
            version: "1.0",
            enabled: "true",
        },
        {
            name: "evm",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "mnr",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "personal",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "fed",
            version: "1.0",
            enabled: "true"
        },
        {
            name: "rsk",
            version: "1.0",
            enabled: "true",
        }
    ]
}
