name: 'Rootstock Integration Tests Action'
description: 'This action provides a containerized environment for running integration tests on Rootstock.'
author: 'Rootstock Labs'

inputs:
  rskj-branch:
    description: 'The rskj branch to checkout'
    required: true
    default: 'master'
  powpeg-node-branch:
    description: 'The powpeg-node branch to checkout'
    required: true
    default: 'master'
  rit-branch:
    description: 'The rootstock-integration-tests branch to checkout'
    required: false
    default: 'main'
  rit-log-level:
    description: 'Log level for the rootstock-integration-tests'
    required: false
    default: 'info'
  repo-owner:
    description: 'The owner of the repository'
    required: false
    default: 'rsksmart'
  rskj-repo:
    description: 'The name of the base rskj repository to checkout (e.g. a private fork)'
    required: false
    default: 'rskj'
  powpeg-repo:
    description: 'The name of the powpeg-node repository to checkout (e.g. a private fork). Defaults to powpeg-node.'
    required: false
    default: 'powpeg-node'
  rit-repo:
    description: 'The name of the rootstock-integration-tests repository to checkout (e.g. a private fork). Defaults to rootstock-integration-tests.'
    required: false
    default: 'rootstock-integration-tests'
  github-token:
    description: 'Token used to clone a private base repository (rskj, powpeg-node or rootstock-integration-tests). Optional; only required when one of the *-repo inputs points at a private repo. Pass it from a GitHub Actions secret (e.g. secrets.MY_TOKEN) and do not hardcode.'
    required: false
    default: ''
  test-suite:
    description: "Which test suite to run: 'short' (fast PR subset) or 'full' (short + extra tests)"
    required: false
    default: 'full'

outputs:
  status:
    description: 'The status of the integration tests'
  message:
    description: 'The output message of the integration tests'

runs:
  using: docker
  image: ./container-action/Dockerfile
  env:
    INPUT_RSKJ_BRANCH: ${{ inputs.rskj-branch }}
    INPUT_POWPEG_NODE_BRANCH: ${{ inputs.powpeg-node-branch }}
    INPUT_RIT_BRANCH: ${{ inputs.rit-branch }}
    INPUT_RIT_LOG_LEVEL: ${{ inputs.rit-log-level }}
    INPUT_REPO_OWNER: ${{ inputs.repo-owner }}
    INPUT_RSKJ_REPO: ${{ inputs.rskj-repo }}
    INPUT_POWPEG_REPO: ${{ inputs.powpeg-repo }}
    INPUT_RIT_REPO: ${{ inputs.rit-repo }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    INPUT_TEST_SUITE: ${{ inputs.test-suite }}
